<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海峽與鳥居 旅誌</title>
<meta name="description" content="2/12–2/18 廣島、門司港、下關、福岡、宮島 7 天行程手冊">
<meta name="theme-color" content="#13283d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316203a'/%3E%3Cpath d='M32 12v40M14.7 22l34.6 20M14.7 42l34.6-20' stroke='%23fff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F4;
  --paper-2:#E8ECEE;
  --ink:#16293C;
  --ink-2:#556574;
  --line:#CAD3DA;
  --ticket:#DDEAF3;
  --ticket-hatch:#C5D9E8;
  --ticket-edge:#8EAFC6;
  --seal:#BF3D2A;
  --seal-soft:#F7E2DD;
  --tip:#1F5A7A;
  --tip-soft:#DDEBF2;
  --night:#13283D;
  --kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","KaiTi",serif;
  --dot:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",monospace;
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A24; --paper-2:#15242F; --ink:#E2E9EE; --ink-2:#97A7B3; --line:#263845;
    --ticket:#16293A; --ticket-hatch:#1C3346; --ticket-edge:#3B6584;
    --seal:#E66A55; --seal-soft:#3A201C; --tip:#86BFDB; --tip-soft:#163041; --night:#0A1520;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A24; --paper-2:#15242F; --ink:#E2E9EE; --ink-2:#97A7B3; --line:#263845;
  --ticket:#16293A; --ticket-hatch:#1C3346; --ticket-edge:#3B6584;
  --seal:#E66A55; --seal-soft:#3A201C; --tip:#86BFDB; --tip-soft:#163041; --night:#0A1520;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans);font-feature-settings:"tnum"}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--tip);outline-offset:2px;border-radius:4px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--night);color:#fff;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.hero-top{position:relative;z-index:3;max-width:680px;margin:0 auto;padding:28px 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;min-height:330px}
.hero-meta{padding-top:6px;max-width:16em}
.hero-meta .en{font-family:var(--kai);font-size:15px;letter-spacing:.04em;opacity:.75;margin:0 0 18px}
.hero-meta .dates{font-family:var(--dot);font-size:30px;line-height:1.1;margin:0}
.hero-meta .len{font-size:14px;opacity:.75;margin:6px 0 18px}
.hero-meta .cities{font-family:var(--kai);font-size:17px;line-height:1.9;margin:0}
.hero h1{writing-mode:vertical-rl;font-family:var(--kai);font-weight:700;font-size:clamp(40px,11.5vw,68px);line-height:1.25;letter-spacing:.12em;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero-photo{position:relative;z-index:1;margin-top:-90px;min-height:120px;background:linear-gradient(#13283D,#2C5A78 60%,#C98A63)}
.hero-photo img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:50% 55%}
@media (min-width:700px){.hero-photo img{aspect-ratio:21/9}}
.hero-photo::before{content:"";position:absolute;inset:0 0 auto 0;height:55%;background:linear-gradient(var(--night),transparent);z-index:1}
.status{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:0 16px 14px}
.status-inner{max-width:648px;margin:0 auto;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.status b{font-family:var(--dot);font-weight:400;font-size:34px;line-height:1}
.status span{font-size:14px}

/* ---------- sticky nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:680px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;height:44px;padding:0 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:12px;line-height:1.2}
.chip b{font-family:var(--dot);font-weight:400;font-size:15px;color:var(--ink)}
.chip.go{font-size:14px;font-weight:600;color:var(--ink);line-height:1}
.chip.is-on{background:var(--ink);color:var(--paper)}
.chip.is-on b{color:var(--paper)}
.chip.is-today{box-shadow:inset 0 0 0 2px var(--seal)}
.nav-sep{flex:none;width:1px;background:var(--line);margin:8px 4px}

/* ---------- route line ---------- */
.route{padding-top:28px;padding-bottom:8px}
.route h2,.sec-head h2{font-family:var(--kai);font-weight:700;font-size:24px;margin:0 0 4px}
.route p.sub,.sec-head p{margin:0;color:var(--ink-2);font-size:14px}
.line-scroll{overflow-x:auto;margin:18px -16px 0;padding:0 16px 10px;scrollbar-width:thin}
.line{position:relative;display:flex;min-width:max-content;padding-top:4px}
.line::before{content:"";position:absolute;left:28px;right:28px;top:15px;height:4px;background:var(--ink);border-radius:2px}
.stn{position:relative;flex:none;width:72px;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink)}
.stn i{display:block;width:26px;height:26px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);position:relative;z-index:1}
.stn.side i{border-style:dashed;border-width:3px;width:22px;height:22px;margin:2px 0}
.stn .nm{font-family:var(--kai);font-size:15px;margin-top:6px;white-space:nowrap}
.stn .d{font-family:var(--dot);font-size:12px;color:var(--ink-2)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);margin-top:4px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid var(--ink);margin-right:6px;vertical-align:-2px}
.legend span.s::before{border-style:dashed;border-width:2px}

/* ---------- act banner ---------- */
.act{position:relative;margin:44px 0 0;color:#fff;background:linear-gradient(135deg,#13283D,#2C5A78);min-height:240px}
.act img{width:100%;height:clamp(240px,62vw,360px);object-fit:cover}
.act::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(10,16,32,.82))}
.act-text{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:0 16px 18px}
.act-text>div{max-width:648px;margin:0 auto}
.act-no{font-family:var(--kai);font-size:16px;opacity:.85}
.act h2{font-family:var(--kai);font-weight:700;font-size:clamp(28px,7.5vw,38px);line-height:1.25;margin:2px 0 8px}
.act p{margin:0;font-size:14px;line-height:1.7;opacity:.92;max-width:34em}

/* ---------- day ---------- */
.day{padding-top:30px;padding-bottom:6px;scroll-margin-top:62px}
.ticket{position:relative;display:grid;grid-template-columns:1fr 84px;border-radius:6px;color:var(--ink);
  background-color:var(--ticket);
  background-image:repeating-linear-gradient(-45deg,transparent 0 5px,var(--ticket-hatch) 5px 6px),repeating-linear-gradient(45deg,transparent 0 5px,var(--ticket-hatch) 5px 6px);
  box-shadow:inset 0 0 0 1px var(--ticket-edge)}
.ticket .main{padding:12px 14px 12px 16px;min-width:0}
.ticket .kind{font-family:var(--dot);font-size:13px;display:flex;justify-content:space-between;gap:8px}
.ticket .kind em{font-style:normal;border:1px solid currentColor;padding:0 6px;border-radius:2px}
.ticket .trip{font-family:var(--dot);font-size:clamp(20px,6vw,27px);line-height:1.3;margin:8px 0 6px;display:flex;flex-wrap:wrap;column-gap:.35em;align-items:baseline}
.ticket .trip .ar{font-size:.8em;color:var(--ink-2)}
.ticket .foot{font-family:var(--dot);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--ink-2)}
.ticket .foot .fare{color:var(--ink);font-size:15px}
.ticket .stub{position:relative;border-left:2px dashed var(--ticket-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--dot);padding:8px 4px;text-align:center}
.ticket .stub small{font-size:12px;color:var(--ink-2)}
.ticket .stub b{font-weight:400;font-size:40px;line-height:1}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1px var(--ticket-edge)}
.ticket .stub::before{top:-8px}.ticket .stub::after{bottom:-8px}
.day.is-today .ticket{box-shadow:inset 0 0 0 2px var(--seal)}
.today-tag{display:none;position:absolute;right:96px;top:-11px;background:var(--seal);color:#fff;font-size:12px;padding:1px 8px;border-radius:3px}
.day.is-today .today-tag{display:block}
.day h3{font-family:var(--kai);font-weight:700;font-size:22px;line-height:1.4;margin:18px 0 4px}
.day .daynote{margin:6px 0 0;font-size:14px;color:var(--seal)}
.photos{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 4px;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.photos::-webkit-scrollbar{display:none}
.credits{margin-top:20px;font-size:12px;line-height:1.7;opacity:.75}
.credits summary{cursor:pointer;font-size:13px}
.credits ul{margin:6px 0 0;padding-left:1.1em}
.credits a{color:inherit}
.photos figure{position:relative;flex:none;margin:0;height:170px;scroll-snap-align:start}
.photos img{height:100%;width:auto;max-width:300px;object-fit:cover;border-radius:6px;background:var(--paper-2)}
.photos figure.r img{width:255px}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;border-radius:0 0 6px 6px;background:linear-gradient(transparent,rgba(8,12,24,.72));color:#fff;font-size:12px;line-height:1.3}
.photos figcaption .k{display:inline-block;margin-right:4px;padding:0 5px;border-radius:3px;background:rgba(255,255,255,.22);font-size:11px}

/* timeline */
.tl{list-style:none;margin:16px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:69px;top:10px;bottom:10px;width:2px;background:var(--line)}
.stop{position:relative;display:grid;grid-template-columns:56px 28px 1fr;column-gap:12px;padding:8px 0}
.stop .t{font-size:15px;font-weight:600;text-align:right;padding-top:3px;line-height:1.3;word-break:keep-all}
.stop .t small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.stop .ic{width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;position:relative;z-index:1;color:var(--ink)}
.stop .ic svg{width:15px;height:15px}
.stop.k-move .ic{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stop .nm{font-size:16px;font-weight:600;line-height:1.45;padding-top:2px}
.stop.is-tbd .ic{border-style:dashed;color:var(--ink-2)}
.tbd{margin-left:8px;font-size:12px;font-weight:600;color:var(--ink-2);border:1px dashed var(--ink-2);padding:0 6px;border-radius:3px;vertical-align:2px}
.stop .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;align-items:center}
.cost{font-size:14px;color:var(--ink-2)}
.cost b{font-weight:600;color:var(--ink)}
.map{display:inline-flex;align-items:center;gap:3px;font-size:14px;color:var(--tip);text-decoration:none;min-height:28px;padding:0 2px}
.map svg{width:14px;height:14px}
.map:hover{text-decoration:underline}
.note{margin:6px 0 0;font-size:14px;line-height:1.6;padding:6px 10px;border-radius:4px;background:var(--tip-soft);color:var(--ink)}
.note.warn{background:var(--seal-soft)}
.note.warn::before{content:"注意　";color:var(--seal);font-weight:600}
.note.tip::before{content:"小提醒　";color:var(--tip);font-weight:600}
.stop.is-next .ic{border-color:var(--seal);box-shadow:0 0 0 4px color-mix(in srgb,var(--seal) 25%,transparent)}
.stop.is-next .nm::after{content:"下一站";margin-left:8px;font-size:12px;font-weight:600;color:#fff;background:var(--seal);padding:1px 6px;border-radius:3px;vertical-align:2px}
.stay{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:12px 0 0;border-top:1px dashed var(--line);font-size:15px}
.stay svg{width:18px;height:18px;flex:none;color:var(--ink-2)}
.stay span{color:var(--ink-2)}

/* ---------- sections ---------- */
.sec{padding-top:48px;padding-bottom:8px;scroll-margin-top:62px}
.sec-head{margin-bottom:18px}
.hotel{padding:22px 0 18px;border-top:1px solid var(--line);scroll-margin-top:62px}
.hotel:last-child{border-bottom:1px solid var(--line)}
.hotel>img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.hotel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:12px}
.hotel h3{margin:0;font-size:19px;line-height:1.35}
.hotel-head .map{flex:none;white-space:nowrap}
.hotel .jp{display:block;font-size:13px;font-weight:400;color:var(--ink-2);margin-top:2px}
.hotel .when{font-family:var(--dot);font-size:14px;color:var(--ink);margin:6px 0 0}
.hotel .lead{margin:8px 0 0;font-size:15px;line-height:1.65}
.facts{display:grid;grid-template-columns:4.2em 1fr;gap:8px 12px;margin:14px 0 0;font-size:14px;line-height:1.6}
.facts dt{color:var(--ink-2);font-weight:600}
.facts dd{margin:0}
.facts dd small{display:block;color:var(--ink-2);font-size:13px}
.htips{list-style:none;margin:14px 0 0;padding:10px 12px;background:var(--tip-soft);border-radius:6px;font-size:14px;line-height:1.65}
.htips li{padding-left:1.1em;text-indent:-1.1em}
.htips li::before{content:"・";color:var(--tip)}
.htips li+li{margin-top:4px}
.stay a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.receipt{background:var(--paper-2);border-radius:6px;padding:18px 16px 16px;font-family:var(--dot)}
.receipt h3{font-family:var(--kai);font-weight:700;font-size:18px;margin:0 0 12px;text-align:center}
.row{display:flex;align-items:baseline;gap:8px;font-size:15px;padding:3px 0}
.row .lb{flex:none}
.row .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.row .v{flex:none}
.row.sub{font-size:13px;color:var(--ink-2);padding-left:12px}
.row.total{font-size:18px;border-top:1px solid var(--ink);margin-top:8px;padding-top:10px}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-family:var(--sans);font-size:14px;color:var(--ink-2)}
.rate input,.conv input{font:inherit;font-family:var(--dot);font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:96px}
.fine{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin:12px 0 0;line-height:1.6}
.conv{margin-top:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.conv input{width:130px}
.conv output{font-family:var(--dot);font-size:20px}

.checks h3{font-family:var(--kai);font-weight:700;font-size:18px;margin:22px 0 6px}
.checks h3:first-child{margin-top:0}
.ck{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;line-height:1.5}
.ck input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;border:2px solid var(--ink-2);border-radius:4px;display:grid;place-items:center;cursor:pointer;background:var(--paper)}
.ck input:checked{background:var(--ink);border-color:var(--ink)}
.ck input:checked::after{content:"";width:6px;height:11px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ck input:checked+span{color:var(--ink-2);text-decoration:line-through}
.ck small{display:block;color:var(--ink-2);font-size:13px}

footer{margin-top:56px;padding:28px 16px 40px;background:var(--night);color:#d8deea;font-size:14px}
footer .wrap{padding:0}
footer b{font-family:var(--dot);font-weight:400;font-size:22px;color:#fff;margin-right:6px}
footer p{margin:6px 0}
footer .sig{margin-top:18px;font-family:var(--kai);opacity:.7}


/* ---------- flexible options ---------- */
.flex{margin-top:18px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.flex>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;min-height:48px}
.flex>summary::-webkit-details-marker{display:none}
.flex>summary b{font-family:var(--kai);font-size:17px}
.flex>summary .cnt{color:var(--ink-2);font-size:14px}
.flex>summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border:solid var(--ink-2);border-width:0 2px 2px 0;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.flex[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
@media (prefers-reduced-motion: reduce){.flex>summary::after{transition:none}}
.flex-body{padding:0 14px 6px}
.flex h4{font-size:14px;color:var(--ink-2);font-weight:600;margin:6px 0 2px}
.alt{padding:10px 0;border-top:1px dashed var(--line)}
.flex h4+.alt{border-top:0}
.alt-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.alt .nm{font-weight:600;line-height:1.45}
.alt p{margin:2px 0 0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;line-height:1.5;padding:1px 8px;border-radius:10px;background:var(--paper-2);color:var(--ink-2)}
.tag.rsv{background:var(--seal-soft);color:var(--seal)}
.tag.in{background:var(--tip-soft);color:var(--tip)}
.evt{margin:8px 0 10px;padding:10px 12px;border-left:3px solid var(--seal);background:var(--seal-soft);border-radius:0 6px 6px 0}
.evt .nm{font-weight:600}
.evt p{margin:2px 0 0;font-size:14px;line-height:1.6}
.map.sm{font-size:13px;flex:none}

/* ---------- eat & buy ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 6px;padding:0 16px 6px;scrollbar-width:none}
.tabs.in{margin:2px -14px 4px;padding:0 14px 6px}
.tab.sm{padding:6px 12px;min-height:36px;font-size:14px}
.tab span{margin-left:5px;font-weight:400;opacity:.65}
.tp h4:first-child{margin-top:10px}
.tp>.food:last-child,.tp>.alt:last-child{border-bottom:0}
.tp .seasonal{margin:8px 0 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:8px 14px;font:600 14px var(--sans);color:var(--ink);cursor:pointer;min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel h3{font-family:var(--kai);font-weight:700;font-size:19px;margin:22px 0 2px}
.panel .when2{font-size:13px;color:var(--ink-2);margin:0}
.food{padding:12px 0;border-bottom:1px solid var(--line)}
.food .nm{font-weight:600;font-size:16px}
.food p{margin:2px 0 0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.shops{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.seasonal{margin:14px 0 0;padding:10px 12px;background:var(--tip-soft);border-radius:6px;font-size:14px;line-height:1.65}
.seasonal b{color:var(--tip)}

/* ---------- events ---------- */
.ev{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.ev:last-child{border-bottom:1px solid var(--line)}
.ev .dt{font-family:var(--dot);font-size:14px;line-height:1.35;color:var(--ink)}
.ev .dt small{display:block;color:var(--ink-2);font-size:12px}
.ev .nm{font-weight:600;font-size:16px;line-height:1.45}
.ev p{margin:2px 0 0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.ev .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;align-items:center}
.ev .meta a.d{font-size:14px;color:var(--tip);text-decoration:none}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;display:none;background:var(--seal);color:#fff;border:0;border-radius:24px;padding:12px 18px;font:600 15px var(--sans);box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.fab.show{display:block}
</style>

  if (!tabs.length) return '';
  const cnt = tabs.map(([k,l]) => `${l} ${data[k].length}`).join('，');
  const bar = tabs.map(([k,l],i) => `<button class="tab sm" type="button" role="tab" id="t${d.n}-${k}" aria-controls="p${d.n}-${k}" aria-selected="${i===0}" tabindex="${i===0?0:-1}">${l}<span>${data[k].length}</span></button>`).join('');
  const panels = tabs.map(([k],i) => {
    let body;
    if (k === 'ev') body = data.ev.map(evtHTML).join('');
    else if (k === 'alt') body = grouped(data.alt, altHTML);
    else body = (k === 'eat' && P.season ? `<div class="seasonal"><b>季節提醒　</b>${esc(P.season)}</div>` : '') + grouped(data[k], foodHTML);
    return `<div class="tp" role="tabpanel" id="p${d.n}-${k}" aria-labelledby="t${d.n}-${k}" ${i ? 'hidden' : ''}>${body}</div>`;
  }).join('');
  return `<details class="flex"><summary><b>彈性選項</b><span class="cnt">${cnt}</span></summary><div class="flex-body"><div class="tabs in" role="tablist" aria-label="Day ${d.n} 彈性選項">${bar}</div>${panels}</div></details>`;
}
let html = '', lastAct = 0;
for (const d of DAYS){
  if (d.act !== lastAct){
    const a = ACTS[d.act]; lastAct = d.act;
    const aimg = a.img[0] === '@' ? (PHOTOS[a.img.slice(1)] ? `<img data-cf="${esc(PHOTOS[a.img.slice(1)])}" data-keep="1" src="${commons(PHOTOS[a.img.slice(1)]).replace('width=640','width=1200')}" alt="${a.alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '') : `<img src="${IMG[a.img]}" alt="${a.alt}" loading="lazy">`;
    html += `<section class="act" aria-label="${a.no} ${a.title}">${aimg}
      <div class="act-text"><div><div class="act-no">${a.no}　${a.where}</div><h2>${a.title}</h2><p>${a.text}</p></div></div></section>`;
  }
  const trip = d.trip.map(x => x === '⇄' ? '<span class="ar">⇄</span>' : esc(x))
                     .join('<span class="ar">→</span>').replace(/<span class="ar">→<\/span><span class="ar">⇄<\/span><span class="ar">→<\/span>/,'<span class="ar">⇄</span>');
  const pics = d.photos.map(([k,alt,kind]) => {
    const tag = kind ? `<span class="k">${kind}</span>` : '';
    if (k[0] !== '@') return `<figure><img src="${IMG[k]}" alt="${esc(alt)}" loading="lazy"><figcaption>${tag}${esc(alt)}</figcaption></figure>`;
    const f = PHOTOS[k.slice(1)]; if (!f) return '';
    return `<figure class="r"><img data-cf="${esc(f)}" src="${commons(f)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"><figcaption>${tag}${esc(alt)}</figcaption></figure>`;
  }).join('');
  const photos = pics ? `<div class="photos">${pics}</div>` : '';
  html += `<article class="wrap day" id="d${d.n}" data-date="${d.date}">
    <div class="ticket" role="img" aria-label="Day ${d.n}，${d.md} 星期${d.wd}，${d.trip.filter(x=>x!=='⇄').join(' 到 ')}">
      <span class="today-tag">今天</span>
      <div class="main">
        <div class="kind"><em>${d.kind}</em><span>${d.jd}</span></div>
        <div class="trip">${trip}</div>
        <div class="foot"><span>経由　${esc(d.via)}</span><span class="fare">${d.fare ? yen(d.fare) : '當日有效'}</span></div>
      </div>
      <div class="stub"><small>Day</small><b>${d.n}</b><small>${ACTS[d.act].no}</small></div>
    </div>
    <h3>${esc(d.title)}</h3>
    ${d.daynote ? `<p class="daynote">${esc(d.daynote)}</p>` : ''}
    ${photos}
    <ol class="tl">${d.stops.map(stopHTML).join('')}</ol>
    ${flexHTML(d)}
    ${d.stay ? `<div class="stay">${ICON.hotel}<div><span>今晚住　</span>${(H => `<a href="#${H ? H.id : 'hotels'}">${esc(H ? H.nm : d.stay)}</a>`)(HOTELS.find(h => h.stayKey === d.stay))}</div></div>` : ''}
  </article>`;
}
$('#days').innerHTML = html;
/* Commons photos: author and license are read live from Commons and listed in the footer */
(async function(){
  const imgs = [...document.querySelectorAll('img[data-cf]')];
  if (!imgs.length) return;
  const files = [...new Set(imgs.map(i => i.dataset.cf))];
  const page = f => 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(f);
  const meta = {};
  for (let i = 0; i < files.length; i += 40){
    const titles = files.slice(i, i + 40).map(f => 'File:' + f).join('|');
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=640&iiextmetadatafilter=Artist|LicenseShortName&titles=' + encodeURIComponent(titles);
    try {
      const j = await (await fetch(url)).json();
      for (const p of Object.values((j.query && j.query.pages) || {})){
        if (!p.imageinfo) continue;
        const ii = p.imageinfo[0], em = ii.extmetadata || {};
        const tmp = document.createElement('div'); tmp.innerHTML = (em.Artist && em.Artist.value) || '';
        meta[p.title.replace(/^File:/, '').replace(/ /g, '_')] = {thumb: ii.thumburl || ii.url, page: ii.descriptionurl, author: tmp.textContent.trim(), lic: (em.LicenseShortName && em.LicenseShortName.value) || ''};
      }
    } catch(e) {}
  }
  const seen = new Set(), items = [];
  for (const img of imgs){
    const f = img.dataset.cf, m = meta[f];
    if (m && /\b(NC|ND)\b|non-?commercial|no ?deriv/i.test(m.lic)){ (img.closest('figure') || img).remove(); continue; }
    if (m && m.thumb && img.isConnected && !img.dataset.keep) img.src = m.thumb;
    if (seen.has(f) || !img.isConnected) continue;
    seen.add(f);
    const who = m && m.author ? esc(m.author) : '作者見原頁';
    const lic = m && m.lic ? '，' + esc(m.lic) : '';
    items.push(`<li>${esc(img.alt)}：<a href="${esc((m && m.page) || page(f))}" target="_blank" rel="noopener">${who}</a>${lic}</li>`);
  }
  $('#creditList').innerHTML = items.join('');
})();
function selectTab(btn){
  const list = btn.parentElement;
  list.querySelectorAll('.tab').forEach(t => { const on = t === btn; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
  list.parentElement.querySelectorAll('.tp').forEach(p => p.hidden = p.id !== btn.getAttribute('aria-controls'));
  list.scrollTo({left: btn.offsetLeft - list.clientWidth/2 + btn.offsetWidth/2, behavior: 'auto'});
}
$('#days').addEventListener('click', e => { const b = e.target.closest('.tabs.in .tab'); if (b) selectTab(b); });
$('#days').addEventListener('keydown', e => {
  const b = e.target.closest('.tabs.in .tab'); if (!b || !['ArrowRight','ArrowLeft'].includes(e.key)) return;
  const tabs = [...b.parentElement.querySelectorAll('.tab')], i = tabs.indexOf(b);
  const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
  n.focus(); selectTab(n); e.preventDefault();
});

/* ---------- events ---------- */
$('#evList').innerHTML = [...EVENTS].sort((x,y) => (x.days.length ? Math.min(...x.days) : 99) - (y.days.length ? Math.min(...y.days) : 99)).map(e => `<div class="ev">
  <div class="dt">${esc(e.dt)}${e.dt2 ? `<small>${esc(e.dt2)}</small>` : ''}</div>
  <div><div class="nm">${esc(e.nm)}</div><p>${esc(e.when)}${e.where ? '，' + esc(e.where) : ''}</p>${e.note ? `<p>${esc(e.note)}</p>` : ''}
  <div class="meta">${e.days.map(n => `<a class="d" href="#d${n}">Day ${n}</a>`).join('')}${e.q ? `<a class="map" href="${mapUrl(e.q)}" target="_blank" rel="noopener" aria-label="在 Google 地圖開啟 ${esc(e.nm)}">${ICON.pin}地圖</a>` : ''}</div></div>
</div>`).join('');

/* ---------- hotels ---------- */
$('#hotelList').innerHTML = HOTELS.map(h => `<article class="hotel" id="${h.id}">
  ${h.img && h.img[0] === '@' ? (PHOTOS[h.img.slice(1)] ? `<img data-cf="${esc(PHOTOS[h.img.slice(1)])}" src="${commons(PHOTOS[h.img.slice(1)])}" alt="${esc(h.nm)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '') : (h.img ? `<img src="${IMG[h.img]}" alt="${esc(h.nm)}" loading="lazy">` : '')}
  <div class="hotel-head"><div><h3>${esc(h.nm)}<span class="jp">${esc(h.jp)}</span></h3><div class="when">${esc(h.when)}　${esc(h.price)}</div></div>
    <a class="map" href="${mapUrl(h.q)}" target="_blank" rel="noopener" aria-label="在 Google 地圖開啟 ${esc(h.nm)}">${ICON.pin}地圖</a></div>
  <p class="lead">${esc(h.lead)}</p>
  ${h.facts.length ? `<dl class="facts">${h.facts.map(([k,v,n]) => `<dt>${esc(k)}</dt><dd>${esc(v)}${n ? `<small>${esc(n)}</small>` : ''}</dd>`).join('')}</dl>` : ''}
  ${h.tips.length ? `<ul class="htips">${h.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
</article>`).join('');

/* ---------- budget ---------- */
const cats = {move:{l:'交通',items:[]}, ticket:{l:'門票、體驗',items:[]}, food:{l:'餐飲',items:[]}};
for (const d of DAYS) for (const s of d.stops) for (const [y,c,l] of (s.cost||[])) cats[c].items.push(y);
const sum = a => a.reduce((x,y) => x+y, 0);
const jpyTotal = sum(Object.values(cats).map(c => sum(c.items)));
const FLIGHT = 15000;
const LODGE = 2000*3 + 2200 + 1350*2;
const range = (a,b) => `${ntd(a)}–${ntd(b).replace('NT$','')}`;
const row = (l,v,cls='') => `<div class="row ${cls}"><span class="lb">${l}</span><span class="dots"></span><span class="v">${v}</span></div>`;
$('#receipt').innerHTML = `<h3>旅費精算</h3>
  ${Object.values(cats).map(c => row(c.l, yen(sum(c.items))) ).join('')}
  ${row('日幣小計', yen(jpyTotal))}
  ${row('機票（桃園－廣島來回）', ntd(FLIGHT))}
  ${row('住宿（六晚）', ntd(LODGE))}
  ${row('合計約', '<span id="grand"></span>', 'total')}
  <div class="rate"><label for="rate">匯率 1 日圓 =</label><input id="rate" inputmode="decimal" value="${store.get('rate', 0.20)}"> 台幣</div>
  <p class="fine">照原規劃表的金額加總，不含購物和伴手禮。匯率可以自己改，換算會跟著更新。</p>`;
function calc(){
  const r = parseFloat($('#rate').value) || 0;
  store.set('rate', r);
  $('#grand').textContent = ntd(jpyTotal * r + FLIGHT + LODGE);
  const y = parseFloat(String($('#yen').value).replace(/[^\d.]/g,'')) || 0;
  $('#yenOut').textContent = ntd(y * r);
}
$('#rate').addEventListener('input', calc);
$('#yen').addEventListener('input', calc);
calc();

/* ---------- checklist ---------- */
const done = store.get('checks', {});
$('#checkList').innerHTML = CHECKS.map(g => `<h3>${g.g}</h3>` + g.items.map(([id,l,s]) =>
  `<label class="ck"><input type="checkbox" data-id="${id}" ${done[id]?'checked':''}><span>${l}${s?`<small>${s}</small>`:''}</span></label>`).join('')).join('');
$('#checkList').addEventListener('change', e => {
  const id = e.target.dataset.id; if (!id) return;
  done[id] = e.target.checked; store.set('checks', done);
});

/* ---------- today / countdown ---------- */
(function(){
  const st = $('#status'), fab = $('#fab');
  const tokyo = ymd('Asia/Tokyo'), taipei = ymd('Asia/Taipei');
  const start = DAYS[0].date, end = DAYS[DAYS.length-1].date;
  const today = DAYS.find(d => d.date === tokyo);
  if (today){
    st.innerHTML = `<b>Day ${today.n}</b><span>${today.md}（${today.wd}）${esc(today.title)}</span>`;
    const el = document.getElementById('d' + today.n);
    el.classList.add('is-today');
    document.querySelector(`.chip[data-day="${today.n}"]`).classList.add('is-today');
    const now = nowMin('Asia/Tokyo');
    for (const li of el.querySelectorAll('.stop')){
      const m = li.dataset.t.match(/(\d{1,2}):(\d{2})/);
      if (m && (+m[1]*60 + +m[2]) >= now){ li.classList.add('is-next'); break; }
    }
    fab.classList.add('show');
    fab.addEventListener('click', () => el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}));
  } else if (taipei < start){
    const days = Math.round((Date.parse(start) - Date.parse(taipei)) / 864e5);
    st.innerHTML = `<b>${days}</b><span>天後出發</span>`;
  } else if (tokyo > end){
    st.innerHTML = `<span>旅程結束，下一趟見。</span>`;
  }
})();

/* ---------- nav highlight ---------- */
(function(){
  const chips = {};
  document.querySelectorAll('.chip').forEach(c => chips[c.dataset.day ? 'd'+c.dataset.day : c.dataset.sec] = c);
  const targets = [...document.querySelectorAll('article.day, section.sec')];
  let cur = null;
  const io = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting){
      const c = chips[e.target.id]; if (!c || c === cur) continue;
      cur && cur.classList.remove('is-on'); c.classList.add('is-on'); cur = c;
      c.scrollIntoView({block:'nearest', inline:'center', behavior:'auto'});
    }
  }, {rootMargin:'-45% 0px -50% 0px'});
  targets.forEach(t => io.observe(t));
})();

</script>
